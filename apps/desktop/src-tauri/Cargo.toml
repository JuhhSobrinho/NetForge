[package]
name = "netforge-desktop"
description = "NetForge desktop shell (Tauri). Contains IPC only; no network rules."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "netforge_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
netforge-engine = { path = "../../../crates/netforge-engine" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.12.7", features = [] }
log = "0.4"
tauri-plugin-log = "2"
